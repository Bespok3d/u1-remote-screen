location = /auth_check {
    internal;
    proxy_pass http://apiserver/access/user$is_args$args;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /screen { return 301 /screen/; }

location /screen/ {
    proxy_pass http://127.0.0.1:8092/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /screen/stream.mjpg {
    auth_request /auth_check;
    proxy_pass http://127.0.0.1:8092/stream.mjpg;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
}

location = /screen/snapshot.jpg {
    auth_request /auth_check;
    proxy_pass http://127.0.0.1:8092/snapshot.jpg;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /screen/snapshot {
    auth_request /auth_check;
    proxy_pass http://127.0.0.1:8092/snapshot;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /screen/touch {
    auth_request /auth_check;
    proxy_pass http://127.0.0.1:8092/touch;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
