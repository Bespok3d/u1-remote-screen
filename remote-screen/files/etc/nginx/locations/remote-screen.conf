# Originally remote-screen.conf from the Extended Firmware overlay 61-app-remote-screen (paxx12), GPL-3.0.
# Modified by the Bespok3d project on 2026-07-28: adds the token auth subrequest and the Bespok3d
# location layout.

location = /auth_check {
    internal;
    # Fetches (snapshot/touch) carry a Bearer header; the <img> stream cannot, so it sends the
    # JWT as the screen_token cookie. The cookie is inherited into this subrequest (cookies are
    # request headers) where set-variable forwarding of the parent query string is not. No
    # credential at all leaves the header empty -> Moonraker falls back to trusted-IP.
    set $screen_cred $http_authorization;
    if ($cookie_screen_token) {
        set $screen_cred "Bearer $cookie_screen_token";
    }
    # A Moonraker API key (the slicer's "API Key / Password") authenticates via X-Api-Key. Fetches
    # send the header (inherited into this subrequest); the <img> stream sends it as the
    # screen_apikey cookie. Either is forwarded to Moonraker, which honours an API key under
    # force_logins.
    set $screen_apikey $http_x_api_key;
    if ($cookie_screen_apikey) {
        set $screen_apikey $cookie_screen_apikey;
    }
    proxy_pass http://apiserver/access/user;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Authorization $screen_cred;
    proxy_set_header X-Api-Key $screen_apikey;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /screen { return 301 /screen/; }

location /screen/ {
    proxy_pass http://127.0.0.1:8092/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The page and its script must load as a matched set. fb-http sends only Last-Modified, so a
    # browser heuristically caches auth.js and a plain reload can pair a fresh index.html with a
    # stale auth.js -> ReferenceError -> the page sticks on "Connecting..." until an empty-cache
    # reload. no-store keeps every load fresh and consistent so a normal reload always recovers.
    add_header Cache-Control "no-store" always;
}

location = /screen/stream.mjpg {
    auth_request /auth_check;
    proxy_pass http://127.0.0.1:8092/stream.mjpg;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_http_version 1.1;
}

location = /screen/snapshot.jpg {
    auth_request /auth_check;
    proxy_pass http://127.0.0.1:8092/snapshot.jpg;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /screen/snapshot {
    auth_request /auth_check;
    proxy_pass http://127.0.0.1:8092/snapshot;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /screen/touch {
    auth_request /auth_check;
    proxy_pass http://127.0.0.1:8092/touch;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
