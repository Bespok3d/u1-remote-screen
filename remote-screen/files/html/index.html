<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snapmaker U1 Screen</title>
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="U1 Screen">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<script src="auth.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; }
#container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
#screen { max-width: 100%; max-height: 100%; cursor: crosshair; touch-action: none; }
#status { position: fixed; top: 8px; right: 8px; color: #888; font: 12px monospace; }
.touch-ring {
    position: fixed; pointer-events: none;
    width: 40px; height: 40px; margin: -20px 0 0 -20px;
    border: 3px solid rgba(255,100,100,0.8);
    border-radius: 50%; opacity: 1;
    animation: touch-fade 0.4s ease-out forwards;
}
@keyframes touch-fade {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
}
</style>
</head>
<body>
<div id="container">
<img id="screen" draggable="false">
</div>
<div id="status">Connecting...</div>
<script>
const img = document.getElementById('screen');
const status = document.getElementById('status');

function isEmbeddedInIframe() {
    try { return window.self !== window.top; } catch (e) { return true; }
}

try {
    if (window.self !== window.top) {
        const style = window.parent.document.createElement('style');
        style.textContent = 'iframe.camera-image[src$="/screen/"]{pointer-events:auto}';
        window.parent.document.head.appendChild(style);
    }
} catch (e) {}

function applyScale() {
    if (!img.naturalWidth || !img.naturalHeight) return;
    const scale = isEmbeddedInIframe() ? 1 : 2;
    img.width = img.naturalWidth * scale;
    img.height = img.naturalHeight * scale;
}

function streamUrl(token) {
    return token ? 'stream.mjpg?token=' + encodeURIComponent(token) : 'stream.mjpg';
}

img.onload = function() { status.textContent = 'Live'; applyScale(); };
img.onerror = function() {
    status.textContent = 'Reconnecting...';
    setTimeout(async function() {
        const token = await getOneshotToken();
        if (token === null) return;
        img.src = streamUrl(token) + '&_=' + Date.now();
    }, 2000);
};

function sendRelease(useKeepalive) {
    const options = { method: 'POST', headers: getAuthHeaders() };
    if (useKeepalive) options.keepalive = true;
    return fetch('touch?a=release', options).catch(function() {});
}

async function startStream() {
    const token = await getOneshotToken();
    if (token === null) return;
    sendRelease(false);
    img.src = streamUrl(token);
}

const HEARTBEAT_MS = 300;
const touchState = { dragging: false, moveInFlight: false, pendingMove: null, heartbeat: null };

function sendHeartbeat() {
    if (!touchState.dragging) return;
    fetch('touch?a=keepalive', { method: 'POST', headers: getAuthHeaders() }).catch(function() {});
}

function startHeartbeat() {
    stopHeartbeat();
    touchState.heartbeat = setInterval(sendHeartbeat, HEARTBEAT_MS);
}

function stopHeartbeat() {
    if (touchState.heartbeat === null) return;
    clearInterval(touchState.heartbeat);
    touchState.heartbeat = null;
}

function showTouchRing(clientX, clientY) {
    const ring = document.createElement('div');
    ring.className = 'touch-ring';
    ring.style.left = clientX + 'px';
    ring.style.top = clientY + 'px';
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 400);
}

function getImageCoords(clientX, clientY) {
    const rect = img.getBoundingClientRect();
    const scaleX = img.naturalWidth / rect.width;
    const scaleY = img.naturalHeight / rect.height;
    const x = Math.round((clientX - rect.left) * scaleX);
    const y = Math.round((clientY - rect.top) * scaleY);
    return { x: x, y: y };
}

function sendTouch(action, x, y) {
    return fetch('touch?a=' + action + '&x=' + x + '&y=' + y, { method: 'POST', headers: getAuthHeaders() })
        .then(function() {
            if (action !== 'move') status.textContent = action + ' (' + x + ',' + y + ')';
            setTimeout(function() { if (status.textContent !== 'Reconnecting...') status.textContent = 'Live'; }, 1000);
        })
        .catch(function() { status.textContent = 'touch error'; });
}

function flushMove() {
    if (!touchState.pendingMove) { touchState.moveInFlight = false; return; }
    const next = touchState.pendingMove;
    touchState.pendingMove = null;
    sendTouch('move', next.x, next.y).finally(flushMove);
}

function onDown(clientX, clientY) {
    touchState.dragging = true;
    startHeartbeat();
    showTouchRing(clientX, clientY);
    const coords = getImageCoords(clientX, clientY);
    sendTouch('down', coords.x, coords.y);
}

function onMove(clientX, clientY) {
    if (!touchState.dragging) return;
    const coords = getImageCoords(clientX, clientY);
    if (touchState.moveInFlight) { touchState.pendingMove = coords; return; }
    touchState.moveInFlight = true;
    sendTouch('move', coords.x, coords.y).finally(flushMove);
}

function onUp(clientX, clientY) {
    if (!touchState.dragging) return;
    touchState.dragging = false;
    touchState.pendingMove = null;
    stopHeartbeat();
    const coords = getImageCoords(clientX, clientY);
    sendTouch('up', coords.x, coords.y);
}

function onCancel(useKeepalive) {
    if (!touchState.dragging) return;
    touchState.dragging = false;
    touchState.pendingMove = null;
    stopHeartbeat();
    sendRelease(useKeepalive);
}

img.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    img.setPointerCapture(e.pointerId);
    onDown(e.clientX, e.clientY);
});

img.addEventListener('pointermove', function(e) {
    onMove(e.clientX, e.clientY);
});

img.addEventListener('pointerup', function(e) {
    onUp(e.clientX, e.clientY);
});

img.addEventListener('pointercancel', function() {
    onCancel(false);
});

img.addEventListener('lostpointercapture', function() {
    onCancel(false);
});

document.addEventListener('visibilitychange', function() {
    if (document.hidden) onCancel(false);
});

window.addEventListener('blur', function() {
    onCancel(false);
});

window.addEventListener('pagehide', function() {
    onCancel(true);
});

startStream();
</script>
<script>
if ('serviceWorker' in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then(function(reg) {
            reg.addEventListener('updatefound', function() {
                const fresh = reg.installing;
                if (!fresh) return;
                fresh.addEventListener('statechange', function() {
                    if (fresh.state === 'activated' && hadController) window.location.reload();
                });
            });
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) reg.update();
            });
        })
        .catch(function() {});
}
</script>
<script>
const UPDATE_POLL_MS = 60000;
const appVersion = { stamp: null };

function fetchAppStamp() {
    return fetch('./', { method: 'HEAD', cache: 'no-store' })
        .then(function(resp) { return resp.headers.get('Last-Modified'); })
        .catch(function() { return null; });
}

function checkForNewVersion() {
    fetchAppStamp().then(function(current) {
        if (!current) return;
        if (appVersion.stamp === null) { appVersion.stamp = current; return; }
        if (current !== appVersion.stamp) window.location.reload();
    });
}

checkForNewVersion();
setInterval(checkForNewVersion, UPDATE_POLL_MS);
document.addEventListener('visibilitychange', function() {
    if (!document.hidden) checkForNewVersion();
});
</script>
</body>
</html>
